          subtitle: >-
            Associate Teaching Professor in <a href="https://eecs.berkeley.edu/">EECS</a> at
            <a href="https://berkeley.edu/">UC Berkeley</a>.<br><br>
            Gireeja Ranade is an Associate Teaching Professor in the Electrical Engineering and
            Computer Science Department at UC Berkeley. Her research interests span theoretical
            projects in machine learning and control, AI for Math, and societal impacts of AI and
            education. She teaches upper-division and graduate level courses such as deep learning
            and optimization, as well as introductory undergraduate courses. Before joining the
            faculty at UC Berkeley, Prof. Ranade was a Researcher at Microsoft Research AI
            in the Adaptive Systems and Interaction Group. She designed and taught the first offering
            of the course sequence EECS 16A and EECS 16B, and received the 2017 UC Berkeley
            Electrical Engineering Award for Outstanding Teaching and the 2020 UC Berkeley award for
            Extraordinary Teaching in Extraordinary Times. Prof. Ranade received her PhD in EECS from UC Berkeley
            and her undergraduate degree from MIT.
