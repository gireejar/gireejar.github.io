# Teaching page (rendered by tools/build_sites.py -> sites/franklin/teaching.md).
#
# Two flat lists of courses:
#   courses:       shown as a single list at the top of the page
#   grad_student:  shown under "As a graduate student"
#
# Each course:
#   code, title       e.g. "EECS 127/227A", "Optimization Models in Engineering"
#   url               (optional) main course link
#   role              (optional) one short line, e.g. "Co-designer and instructor"
#   semesters         list of {term, url}; url optional. List oldest first.
#   links             (optional) extra resources: list of {text, url}
#   note              (optional) one short line shown in small print
#
# To add a semester: append `- {term: Fall 2027, url: https://...}` under that course's `semesters`.
# Lines starting with `#` are ignored.

