# News items for the "Updates" section on the home page.
#
# HOW TO ADD AN UPDATE
#   1. Add one line anywhere in this list (order does not matter; items are
#      sorted newest-first automatically by `date`).
#   2. Run:  python3 tools/build_sites.py
#
# FIELDS
#   date:  YYYY-MM-DD, YYYY-MM, or YYYY. Used for sorting; shown as "Mon YYYY".
#   label: (optional) text to show instead of the date, e.g. "Spring 2026".
#   text:  the update, in Markdown: [link text](https://...), *italic*, **bold**.
#          Wrap the whole text in double quotes; use single quotes inside if needed.
#
# The 8 most recent items appear on the home page; the rest go to /updates/.
#
# Template:
# - {date: 2026-11, text: "Name presented [*Paper title*](https://...) at [Venue](https://...)."}

